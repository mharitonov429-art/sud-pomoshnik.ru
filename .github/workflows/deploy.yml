# .github/workflows/deploy.yml (ВРЕМЕННЫЙ вариант: хостинг GitHub Pages, пока нет своего сервера)
# Перед использованием:
#   1. Settings → Pages → Build and deployment → Source: GitHub Actions
#   2. Settings → Pages → Custom domain: sud-pomoshnik.ru, затем включить Enforce HTTPS
#   3. Для приватного репозитория Pages доступен только на платном тарифе GitHub (проверьте условия вашего тарифа)
# ВНИМАНИЕ: файл не запускался. Версии действий (actions/*) проверьте в их документации: к вашей дате могли выйти новые.
# Сборка (npm run build) сама делает ротацию ссылок на главной (сдвиг по дням) и sitemap.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 0 * * *'       # 00:15 UTC = 03:15 по Москве
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22


      - run: npm test


      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
