# nginx для sud-pomoshnik.ru (статический сайт).
# ВНИМАНИЕ: файл написан без доступа к nginx и НЕ проверялся на сервере.
# До перезагрузки выполните: nginx -t
# Подставьте свои пути к сертификатам и каталогу сайта.
#
# Правило nginx: если в блоке location есть add_header, заголовки уровня server там НЕ наследуются.
# Поэтому в location ниже для кэша используется expires, а add_header оставлен только на уровне server.

# Ограничение частоты запросов к форме (этот блок кладётся в контекст http, например conf.d/limits.conf):
# limit_req_zone $binary_remote_addr zone=forms:10m rate=5r/m;

# 1. HTTP → HTTPS (один редирект на канонический адрес)
server {
    listen 80;
    listen [::]:80;
    server_name sud-pomoshnik.ru www.sud-pomoshnik.ru;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://sud-pomoshnik.ru$request_uri; }
}

# 2. www → без www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx 1.25.1+. Для старых версий: listen 443 ssl http2;
    server_name www.sud-pomoshnik.ru;

    ssl_certificate     /etc/letsencrypt/live/sud-pomoshnik.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sud-pomoshnik.ru/privkey.pem;

    return 301 https://sud-pomoshnik.ru$request_uri;
}

# 3. Основной сайт
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sud-pomoshnik.ru;

    ssl_certificate     /etc/letsencrypt/live/sud-pomoshnik.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sud-pomoshnik.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/sud-pomoshnik/public;
    index index.html;
    charset utf-8;
    merge_slashes on;

    # Лог в формате combined: его читает rotate-links.mjs
    access_log /var/log/nginx/sud-pomoshnik.access.log combined;
    error_log  /var/log/nginx/sud-pomoshnik.error.log warn;

    # Сжатие (text/html сжимается по умолчанию)
    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml;

    # Безопасность. HSTS включайте после проверки, что HTTPS работает на всех страницах:
    # add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # /index.html → /
    location ~ ^(.*)/index\.html$ { return 301 $1/; }

    # Служебные файлы не отдаём, кроме .well-known
    location ^~ /.well-known/ { allow all; }
    location ~ /\. { deny all; }

    # Статика с хешами в именах: кэш на год
    location ~* \.(?:css|js|woff2|avif|webp|jpg|jpeg|png|svg|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    # robots, sitemap, llms: короткий кэш
    location ~ ^/(robots\.txt|sitemap.*\.xml|llms\.txt)$ {
        expires 1h;
        try_files $uri =404;
    }

    # Форма заявок (обработчик на локальном порту, Этап 6)
    # На сайте сейчас нет форм. Раскомментируйте вместе с limit_req_zone, когда появится обработчик.
    # location /api/ {
    #     limit_req zone=forms burst=5 nodelay;
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # HTML: каждый раз проверять свежесть (сайт пересобирается раз в сутки)
    location / {
        expires -1;
        try_files $uri $uri/ =404;   # /uslugi → 301 на /uslugi/ делает nginx сам
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # 301 со старых адресов, если появятся (создайте файл, строки вида: rewrite ^/старый/$ /новый/ permanent;)
    # include /etc/nginx/sud-pomoshnik-redirects.conf;
}
